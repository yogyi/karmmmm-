openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Karm Baba B2B Marketplace API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product operations
  - name: suppliers
    description: Supplier operations
  - name: categories
    description: Category operations
  - name: rfq
    description: Request for Quotation operations
  - name: users
    description: User operations
  - name: reviews
    description: Review operations
  - name: dashboard
    description: Dashboard and analytics
  - name: shop
    description: Shop plans and subscriptions
  - name: leads
    description: Seller CRM leads
  - name: Storage
    description: Object storage upload and serving endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /categories:
    get:
      operationId: listCategories
      tags: [categories]
      summary: List all categories with product counts
      responses:
        "200":
          description: Categories list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products with optional search and filter
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: categoryId
          in: query
          schema:
            type: ["integer", "null"]
        - name: supplierId
          in: query
          schema:
            type: ["integer", "null"]
        - name: minPrice
          in: query
          schema:
            type: ["number", "null"]
        - name: maxPrice
          in: query
          schema:
            type: ["number", "null"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Products list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a new product listing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /products/featured:
    get:
      operationId: getFeaturedProducts
      tags: [products]
      summary: Get featured/trending products for homepage
      responses:
        "200":
          description: Featured products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /suppliers:
    get:
      operationId: listSuppliers
      tags: [suppliers]
      summary: List suppliers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: verified
          in: query
          schema:
            type: ["boolean", "null"]
        - name: categoryId
          in: query
          schema:
            type: ["integer", "null"]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Suppliers list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierListResponse"
    post:
      operationId: createSupplier
      tags: [suppliers]
      summary: Create a supplier profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /suppliers/featured:
    get:
      operationId: getFeaturedSuppliers
      tags: [suppliers]
      summary: Get top/verified suppliers for homepage
      responses:
        "200":
          description: Featured suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Supplier"

  /suppliers/{id}:
    get:
      operationId: getSupplier
      tags: [suppliers]
      summary: Get supplier by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"
        "404":
          description: Not found
    patch:
      operationId: updateSupplier
      tags: [suppliers]
      summary: Update a supplier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierUpdate"
      responses:
        "200":
          description: Updated supplier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Supplier"

  /rfq:
    get:
      operationId: listRfqs
      tags: [rfq]
      summary: List RFQs
      parameters:
        - name: buyerId
          in: query
          schema:
            type: ["integer", "null"]
        - name: supplierId
          in: query
          schema:
            type: ["integer", "null"]
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: RFQ list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rfq"
    post:
      operationId: createRfq
      tags: [rfq]
      summary: Submit a Request for Quotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfq/{id}:
    get:
      operationId: getRfq
      tags: [rfq]
      summary: Get RFQ by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: RFQ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"
    patch:
      operationId: updateRfq
      tags: [rfq]
      summary: Update RFQ status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqUpdate"
      responses:
        "200":
          description: Updated RFQ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfq/{id}/quotes:
    post:
      operationId: submitRfqQuote
      tags: [rfq]
      summary: Submit or update a seller quote on an open RFQ
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqQuoteInput"
      responses:
        "200":
          description: Updated RFQ with quotes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"
        "201":
          description: Created quote on RFQ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /rfq/{id}/award:
    post:
      operationId: awardRfqQuote
      tags: [rfq]
      summary: Buyer awards one quote and closes the deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RfqAwardInput"
      responses:
        "200":
          description: Deal closed with awarded quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Rfq"

  /users:
    post:
      operationId: createUser
      tags: [users]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/login:
    post:
      operationId: loginUser
      tags: [users]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /users/sync:
    post:
      operationId: syncUser
      tags: [users]
      summary: Sync authenticated Clerk user into Postgres
      description: >
        Requires a verified Clerk email. Links by clerkId first; may link an existing
        email row without clearing password. Refuses if email is already linked to
        another Clerk account.
      responses:
        "200":
          description: Existing user updated or linked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
        "403":
          description: Email not verified
        "409":
          description: Email linked to another Clerk account

  /users/me:
    get:
      operationId: getCurrentUser
      tags: [users]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
        "404":
          description: Profile not synced yet
    patch:
      operationId: updateCurrentUser
      tags: [users]
      summary: Update the authenticated user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCurrentUserInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required

  /users/me/onboarding:
    post:
      operationId: completeUserOnboarding
      tags: [users]
      summary: Choose buyer or seller role (explicit onboarding)
      description: >
        Sets the authenticated user's marketplace role. Role is stored in Postgres
        and is not overwritten by opaque Clerk publicMetadata on sync (except admin elevation).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Authentication required
        "403":
          description: Admins cannot change role via onboarding

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /plans:
    get:
      operationId: listPlans
      tags: [shop]
      summary: List active shop plans
      responses:
        "200":
          description: Plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanListResponse"

  /shop/setup:
    post:
      operationId: setupShop
      tags: [shop]
      summary: Open a Free shop (subscription-based setup)
      description: >
        Creates a linked supplier + Free subscription when the user has no shop.
        Paid plan codes are rejected for non-admins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [companyName]
              properties:
                companyName:
                  type: string
                location:
                  type: string
                region:
                  type: string
                  enum: [inr, usd]
                planCode:
                  type: string
                  default: free
      responses:
        "201":
          description: Shop created or Free plan ensured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSubscription"
        "400":
          description: Missing company name
        "402":
          description: Paid plan not self-serve

  /shop/subscription:
    get:
      operationId: getShopSubscription
      tags: [shop]
      summary: Get linked shop subscription and usage
      responses:
        "200":
          description: Entitlements and usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSubscription"
        "401":
          description: Authentication required
        "404":
          description: No shop linked
    post:
      operationId: updateShopSubscription
      tags: [shop]
      summary: Assign shop plan (admin for paid; sellers may only set free)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopSubscriptionInput"
      responses:
        "200":
          description: Updated subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSubscription"
        "402":
          description: Payment or sales approval required
        "403":
          description: Forbidden

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List CRM leads for the seller's shop (or admin filter)
      parameters:
        - name: supplierId
          in: query
          schema:
            type: ["integer", "null"]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Lead list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadListResponse"
        "401":
          description: Authentication required

  /leads/public:
    post:
      operationId: createPublicLead
      tags: [leads]
      summary: Create a lead from a public shop contact form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicLeadInput"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "402":
          description: Lead quota exceeded

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get a lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "403":
          description: Forbidden
        "404":
          description: Not found
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead status / fields
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadInput"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List reviews for a supplier or product
      parameters:
        - name: supplierId
          in: query
          schema:
            type: ["integer", "null"]
        - name: productId
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: Reviews list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get platform stats for dashboard
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/supplier/{id}:
    get:
      operationId: getSupplierDashboard
      tags: [dashboard]
      summary: Get supplier-specific dashboard data
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Supplier dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierDashboard"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Internal error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an uploaded object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Category:
      type: object
      required: [id, name, slug, productCount]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        icon:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        productCount:
          type: integer
        description:
          type: ["string", "null"]

    Product:
      type: object
      required: [id, name, supplierId, categoryId, minPrice, maxPrice, unit, minOrder, imageUrl, inStock, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        supplierId:
          type: integer
        supplierName:
          type: ["string", "null"]
        supplierVerified:
          type: ["boolean", "null"]
        categoryId:
          type: integer
        categoryName:
          type: ["string", "null"]
        minPrice:
          type: number
        maxPrice:
          type: number
        unit:
          type: string
        minOrder:
          type: integer
        imageUrl:
          type: string
        images:
          type: array
          items:
            type: string
        inStock:
          type: boolean
        featured:
          type: boolean
        rating:
          type: ["number", "null"]
        reviewCount:
          type: integer
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string

    ProductInput:
      type: object
      required: [name, supplierId, categoryId, minPrice, maxPrice, unit, minOrder, imageUrl]
      properties:
        name:
          type: string
        description:
          type: string
        supplierId:
          type: integer
        categoryId:
          type: integer
        minPrice:
          type: number
        maxPrice:
          type: number
        unit:
          type: string
        minOrder:
          type: integer
        imageUrl:
          type: string
        images:
          type: array
          items:
            type: string
        inStock:
          type: boolean
        featured:
          type: boolean
        tags:
          type: array
          items:
            type: string

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        minPrice:
          type: number
        maxPrice:
          type: number
        unit:
          type: string
        minOrder:
          type: integer
        imageUrl:
          type: string
        inStock:
          type: boolean
        featured:
          type: boolean

    ProductListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Supplier:
      type: object
      required: [id, companyName, location, verified, rating, reviewCount, createdAt]
      properties:
        id:
          type: integer
        companyName:
          type: string
        description:
          type: ["string", "null"]
        location:
          type: string
        country:
          type: ["string", "null"]
        logoUrl:
          type: ["string", "null"]
        coverUrl:
          type: ["string", "null"]
        verified:
          type: boolean
        yearsInBusiness:
          type: ["integer", "null"]
        employeeCount:
          type: ["string", "null"]
        mainProducts:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string
        rating:
          type: number
        reviewCount:
          type: integer
        productCount:
          type: integer
        responseRate:
          type: ["number", "null"]
        responseTime:
          type: ["string", "null"]
        createdAt:
          type: string

    SupplierInput:
      type: object
      required: [companyName, location]
      properties:
        companyName:
          type: string
        description:
          type: string
        location:
          type: string
        country:
          type: string
        logoUrl:
          type: string
        coverUrl:
          type: string
        yearsInBusiness:
          type: integer
        employeeCount:
          type: string
        mainProducts:
          type: array
          items:
            type: string
        certifications:
          type: array
          items:
            type: string

    SupplierUpdate:
      type: object
      properties:
        companyName:
          type: string
        description:
          type: string
        location:
          type: string
        logoUrl:
          type: string
        coverUrl:
          type: string
        verified:
          type: boolean

    SupplierListResponse:
      type: object
      required: [items, total, page, limit]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Supplier"
        total:
          type: integer
